name: Harvest OSM & Publish Datasets

on:
  workflow_dispatch:
    inputs:
      continent:
        description: 'Geofabrik Continent or Region'
        required: true
        default: 'central-america'
        type: choice
        options:
          - central-america
          - south-america
          - australia-oceania
          - africa
          - europe
          - asia
          - north-america
      specific_country:
        description: 'Optional single country slug (e.g., guatemala, monaco)'
        required: false
        type: string
      skip_existing:
        description: 'Skip countries already published in GitHub Release'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  harvest-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool aria2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Harvester Engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS=""
          if [ -n "${{ inputs.specific_country }}" ]; then
            FLAGS="$FLAGS --country ${{ inputs.specific_country }}"
          fi
          if [ "${{ inputs.skip_existing }}" != "true" ]; then
            FLAGS="$FLAGS --force"
          fi
          python main.py --continent "${{ inputs.continent }}" $FLAGS

      - name: Publish Artifacts to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="release-${{ inputs.continent }}"
          RELEASE_TITLE="OSM Datasets: ${{ inputs.continent }}"
          
          # Check if any new exports were generated
          if [ -z "$(ls -A /tmp/osm_scratch/exports/ 2>/dev/null)" ]; then
            echo "ℹ️ No new files generated (all queued targets were already up to date)."
            exit 0
          fi

          # List generated files
          ls -lh /tmp/osm_scratch/exports/
          
          # Create release if it doesn't exist yet
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Creating release $TAG_NAME..."
            gh release create "$TAG_NAME" \
              --title "$RELEASE_TITLE" \
              --notes "Automated daily extraction of administrative boundaries, weather coordinates, and localized settlements from OpenStreetMap and Geofabrik."
          fi

          # Upload artifacts incrementally without clobbering other countries
          gh release upload "$TAG_NAME" /tmp/osm_scratch/exports/* --clobber
