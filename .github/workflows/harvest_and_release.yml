name: Harvest OSM & Publish Datasets

on:
  workflow_dispatch:
    inputs:
      continent:
        description: 'Geofabrik Continent or Region (use all for worldwide)'
        required: true
        default: 'central-america'
        type: choice
        options:
          - central-america
          - south-america
          - australia-oceania
          - africa
          - europe
          - asia
          - north-america
          - all
      specific_country:
        description: 'Optional single country slug (e.g., guatemala, monaco, greenland)'
        required: false
        type: string
      skip_existing:
        description: 'Skip countries already published in GitHub Release'
        required: true
        default: true
        type: boolean
      max_runners:
        description: 'Max parallel GitHub runner jobs (default: 6, max: 20)'
        required: true
        default: '6'
        type: string
      new_dated_release:
        description: 'Create new dated release tag (e.g. v2026.10.19-1430) instead of fixed tag'
        required: false
        default: false
        type: boolean
      custom_release_tag:
        description: 'Target/resume a specific release tag (e.g. v2026.10.19-0939, release-worldwide). Skips published countries, processing only remaining/failed ones.'
        required: false
        type: string
      merge_unified_release:
        description: 'Consolidate all countries into 3 unified assets (spatial DB zip, OSM DB zip, PBF bundle zip)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  plan-harvest:
    name: 🔍 Plan Matrix & Prepare Release
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      tag_name: ${{ steps.plan.outputs.tag_name }}
      has_targets: ${{ steps.plan.outputs.has_targets }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Planning Dependencies
        run: |
          pip install requests

      - name: Calculate Matrix & Check Releases
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS=""
          if [ -n "${{ inputs.specific_country }}" ]; then
            FLAGS="$FLAGS --country ${{ inputs.specific_country }}"
          fi
          if [ "${{ inputs.skip_existing }}" != "true" ]; then
            FLAGS="$FLAGS --force"
          fi
          if [ -n "${{ inputs.custom_release_tag }}" ]; then
            TAG="${{ inputs.custom_release_tag }}"
            FLAGS="$FLAGS --tag-name $TAG"
          elif [ "${{ inputs.new_dated_release }}" = "true" ]; then
            DATE_STR=$(date +'%Y.%m.%d-%H%M')
            if [ "${{ inputs.continent }}" = "all" ]; then
              TAG="v${DATE_STR}"
            else
              TAG="release-${{ inputs.continent }}-${DATE_STR}"
            fi
            FLAGS="$FLAGS --tag-name $TAG"
          fi
          python main.py --continent "${{ inputs.continent }}" --plan-matrix --max-runners "${{ inputs.max_runners }}" $FLAGS

      - name: Pre-Create Release Tag
        if: steps.plan.outputs.has_targets == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ steps.plan.outputs.tag_name }}"
          RELEASE_TITLE="OSM Datasets: ${{ inputs.continent }}"
          if [ "${{ inputs.continent }}" = "all" ]; then
            RELEASE_TITLE="OSM Datasets: Worldwide"
          fi
          if [ -n "${{ inputs.custom_release_tag }}" ]; then
            RELEASE_TITLE="$RELEASE_TITLE ($TAG_NAME)"
          elif [ "${{ inputs.new_dated_release }}" = "true" ]; then
            RELEASE_TITLE="$RELEASE_TITLE ($TAG_NAME)"
          fi
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Creating release $TAG_NAME..."
            gh release create "$TAG_NAME" \
              --title "$RELEASE_TITLE" \
              --notes "Automated parallel extraction of administrative boundaries, spatial coordinates, pre-filtered PBF extracts, and localized settlements from OpenStreetMap and Geofabrik."
          fi

  parallel-harvest:
    name: ⚡ Runner ${{ matrix.batch_id }} (${{ matrix.count }} countries)
    needs: plan-harvest
    if: needs.plan-harvest.outputs.has_targets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan-harvest.outputs.matrix) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Runner Disk Space
        run: |
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          echo "Disk space after cleanup:"
          df -h /

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool aria2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Harvester Engine for Batch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXTRA_FLAGS=""
          if [ "${{ inputs.skip_existing }}" != "true" ]; then
            EXTRA_FLAGS="--force"
          fi
          python main.py --batch "${{ matrix.countries }}" --workers 2 --continent "${{ inputs.continent }}" --tag-name "${{ needs.plan-harvest.outputs.tag_name }}" $EXTRA_FLAGS

      - name: Upload Artifacts to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ needs.plan-harvest.outputs.tag_name }}"
          EXPORT_DIR="${RUNNER_TEMP:-/tmp/osm_scratch}/exports"
          echo "Scanning export directory: $EXPORT_DIR"
          if [ -d "$EXPORT_DIR" ] && [ -n "$(ls -A "$EXPORT_DIR" 2>/dev/null)" ]; then
            ls -lh "$EXPORT_DIR/"
            echo "Uploading all exports to release $TAG_NAME..."
            uploaded=false
            wait_times=(10 30 60)
            for attempt in 1 2 3; do
              echo "Upload attempt $attempt of 3..."
              if gh release upload "$TAG_NAME" "$EXPORT_DIR"/* --clobber; then
                echo "✅ Successfully uploaded all assets on attempt $attempt"
                uploaded=true
                break
              else
                wait_sec=${wait_times[$((attempt-1))]}
                echo "⚠️ Upload attempt $attempt failed. Retrying in ${wait_sec}s..."
                sleep $wait_sec
              fi
            done
            if [ "$uploaded" = "false" ]; then
              echo "❌ Failed to upload assets after 3 attempts."
              exit 1
            fi
          else
            echo "ℹ️ No exports found in $EXPORT_DIR to upload."
          fi

  consolidate-release:
    name: 📦 Consolidate into 3 Unified Datasets
    needs: [plan-harvest, parallel-harvest]
    if: always() && (inputs.merge_unified_release == true) && (needs.plan-harvest.result == 'success') && (needs.parallel-harvest.result == 'success' || needs.parallel-harvest.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Runner Disk Space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          df -h /

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Download Country Assets from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ needs.plan-harvest.outputs.tag_name }}"
          DOWNLOAD_DIR="${RUNNER_TEMP:-/tmp/osm_scratch}/release_downloads"
          mkdir -p "$DOWNLOAD_DIR"
          echo "Downloading individual country databases and PBFs from release $TAG_NAME..."
          gh release download "$TAG_NAME" -D "$DOWNLOAD_DIR" --pattern "*_spatial.sqlite" || echo "No spatial.sqlite files found"
          gh release download "$TAG_NAME" -D "$DOWNLOAD_DIR" --pattern "*_osm.sqlite" || echo "No osm.sqlite files found"
          gh release download "$TAG_NAME" -D "$DOWNLOAD_DIR" --pattern "*_filtered.osm.pbf" || echo "No filtered.osm.pbf files found"

      - name: Build 3 Unified Merged Assets
        run: |
          DOWNLOAD_DIR="${RUNNER_TEMP:-/tmp/osm_scratch}/release_downloads"
          UNIFIED_DIR="${RUNNER_TEMP:-/tmp/osm_scratch}/unified_exports"
          mkdir -p "$UNIFIED_DIR"
          LABEL="${{ inputs.continent }}"
          if [ "$LABEL" = "all" ]; then
            LABEL="worldwide"
          fi
          python main.py --merge-dir "$DOWNLOAD_DIR" --merge-output "$UNIFIED_DIR" --merge-label "$LABEL"

      - name: Upload 3 Unified Assets to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ needs.plan-harvest.outputs.tag_name }}"
          UNIFIED_DIR="${RUNNER_TEMP:-/tmp/osm_scratch}/unified_exports"
          if [ -d "$UNIFIED_DIR" ] && [ -n "$(ls -A "$UNIFIED_DIR" 2>/dev/null)" ]; then
            ls -lh "$UNIFIED_DIR/"
            echo "Uploading 3 unified assets to release $TAG_NAME..."
            uploaded=false
            wait_times=(10 30 60)
            for attempt in 1 2 3; do
              echo "Upload attempt $attempt of 3..."
              if gh release upload "$TAG_NAME" "$UNIFIED_DIR"/* --clobber; then
                echo "✅ Successfully uploaded unified assets on attempt $attempt"
                uploaded=true
                break
              else
                wait_sec=${wait_times[$((attempt-1))]}
                echo "⚠️ Upload attempt $attempt failed. Retrying in ${wait_sec}s..."
                sleep $wait_sec
              fi
            done
            if [ "$uploaded" = "false" ]; then
              echo "❌ Failed to upload unified assets after 3 attempts."
              exit 1
            fi
          else
            echo "ℹ️ No unified assets found in $UNIFIED_DIR."
          fi
